# ==============================================================================
# LeaveTrack Application Configuration
# Environment variables override local defaults when deployed on Render / Railway
# ==============================================================================

server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# MySQL Database Configuration
# Works with Aiven, TiDB Cloud, Clever Cloud, Railway, or local MySQL
# Supports full JDBC URL via SPRING_DATASOURCE_URL or individual variables
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:leavetrack_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:Monishkumar@756}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Security & JWT Configuration
# ------------------------------------------------------------------------------
# Secret must be at least 256 bits (32+ characters) for HMAC-SHA256
leavetrack.app.jwtSecret=${JWT_SECRET:LeaveTrackSuperSecretEnterpriseKeyWith256BitsMinimumForSecurity2026!}
# 24 Hours in milliseconds: 24 * 60 * 60 * 1000 = 86400000
leavetrack.app.jwtExpirationMs=86400000

# CORS - allow requests from the deployed frontend
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# Logging
logging.level.com.leavetrack=INFO
logging.level.org.springframework.security=WARN
