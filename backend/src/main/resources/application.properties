# ==============================================================================
# LeaveTrack Application Configuration
# ==============================================================================

server.port=8080

# ------------------------------------------------------------------------------
# MySQL Database Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/leavetrack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Monishkumar@756
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Security & JWT Configuration
# ------------------------------------------------------------------------------
# Secret must be at least 256 bits (32+ characters) for HMAC-SHA256
leavetrack.app.jwtSecret=LeaveTrackSuperSecretEnterpriseKeyWith256BitsMinimumForSecurity2026!
# 24 Hours in milliseconds: 24 * 60 * 60 * 1000 = 86400000
leavetrack.app.jwtExpirationMs=86400000

# Logging
logging.level.com.leavetrack=INFO
logging.level.org.springframework.security=WARN
