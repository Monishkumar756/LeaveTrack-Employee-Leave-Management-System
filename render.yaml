services:
  # ============================================================================
  # 1. Backend Web Service (Spring Boot Docker)
  # ============================================================================
  - type: web
    name: leavetrack-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/auth/login
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        value: LeaveTrackSuperSecretEnterpriseKeyWith256BitsMinimumForSecurity2026!

  # ============================================================================
  # 2. Frontend Static Site (React)
  # ============================================================================
  - type: web
    name: leavetrack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
